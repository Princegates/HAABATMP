# Render blueprint for STAGING: a separate copy to test releases first. Use its own Supabase project, never production data.
# Secrets (sync: false) are entered once in the Render dashboard and never stored in git.

envVarGroups:
  - name: haab-atmp-staging
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: AUTH_MODE, value: supabase }
      - { key: STORAGE_DRIVER, value: supabase }
      - { key: SUPABASE_STORAGE_BUCKET, value: atmp-documents-staging }
      - { key: DATABASE_SSL, value: "true" }
      - { key: DATABASE_URL, sync: false }          # Supabase pooled connection string
      - { key: DATABASE_URL_DIRECT, sync: false }   # Supabase direct connection string (migrations)
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: DATA_ENCRYPTION_KEY, sync: false }   # openssl rand -base64 32
      - { key: WEB_ORIGIN, sync: false }            # https://training.<your domain>
      - { key: PUBLIC_WEB_URL, sync: false }        # same as WEB_ORIGIN
      - { key: PROXY_SHARED_SECRET, sync: false }   # random 24+ characters; the web service needs the SAME value

services:
  - type: web
    name: haab-atmp-api-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: claude/charming-dijkstra-6bb7fq   # staging deploys from this branch for now; change to `staging` or `main` later
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    # Applies new database migrations before each release (paid plans). On a free plan run: npm run migrate
    preDeployCommand: node scripts/migrate.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: haab-atmp-staging

  - type: web
    name: haab-atmp-web-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: claude/charming-dijkstra-6bb7fq   # staging deploys from this branch for now; change to `staging` or `main` later
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PROXY_SHARED_SECRET, sync: false }   # same value as on the API
      - { key: API_URL, sync: false }               # the API's URL, for example https://haab-atmp-api-staging.onrender.com

  # Housekeeping every 15 minutes: closes registration at the deadline, starts programmes, closes timed-out exams,
  # sends certificate-expiry and class reminders, and delivers queued email. Safe to run twice.
  - type: cron
    name: haab-atmp-jobs-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: claude/charming-dijkstra-6bb7fq   # staging deploys from this branch for now; change to `staging` or `main` later
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: node apps/api/dist/scripts/jobs.js
    envVars:
      - fromGroup: haab-atmp-staging
