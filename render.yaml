# Render blueprint for production. See docs/DEPLOYMENT.md for the full go-live checklist.
# Secrets (sync: false) are asked for once when you create the Blueprint and are never stored in git.
# Environment groups cannot hold prompted secrets, so each service lists its own variables.
# For a staging copy, use render.staging.yaml with a separate Supabase project.
# Production deploys from the `production` branch. Merge to it only when a release has passed staging.

services:
  - type: web
    name: haab-atmp-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: production
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    # Applies new database migrations before each release.
    preDeployCommand: node scripts/migrate.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: AUTH_MODE, value: supabase }
      - { key: STORAGE_DRIVER, value: supabase }
      - { key: SUPABASE_STORAGE_BUCKET, value: atmp-documents }
      - { key: DATABASE_SSL, value: "true" }
      - { key: DATABASE_URL, sync: false }          # Supabase Transaction pooler string (port 6543), password filled in
      - { key: SUPABASE_URL, sync: false }          # https://<project>.supabase.co
      - { key: SUPABASE_ANON_KEY, sync: false }     # the publishable key (or legacy anon key)
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }   # the secret key (or legacy service_role key)
      - { key: DATA_ENCRYPTION_KEY, sync: false }   # 32 random bytes, base64. Keep a sealed copy.
      - { key: WEB_ORIGIN, sync: false }            # https://training.<your domain>
      - { key: PUBLIC_WEB_URL, sync: false }        # same as WEB_ORIGIN
      - { key: PROXY_SHARED_SECRET, sync: false }   # random hex; the web service needs the SAME value

  - type: web
    name: haab-atmp-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: production
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: PROXY_SHARED_SECRET, sync: false }   # same value as on the API
      - { key: API_URL, sync: false }               # the API's URL, for example https://haab-atmp-api.onrender.com

  # Housekeeping every 15 minutes: closes registration at the deadline, starts programmes, closes timed-out exams,
  # sends certificate-expiry and class reminders, and delivers queued email. Safe to run twice.
  - type: cron
    name: haab-atmp-jobs
    runtime: node
    region: frankfurt
    plan: starter
    branch: production
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: node apps/api/dist/scripts/jobs.js
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: AUTH_MODE, value: supabase }
      - { key: STORAGE_DRIVER, value: supabase }
      - { key: SUPABASE_STORAGE_BUCKET, value: atmp-documents }
      - { key: DATABASE_SSL, value: "true" }
      - { key: DATABASE_URL, sync: false }          # Supabase Transaction pooler string (port 6543), password filled in
      - { key: SUPABASE_URL, sync: false }          # https://<project>.supabase.co
      - { key: SUPABASE_ANON_KEY, sync: false }     # the publishable key (or legacy anon key)
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }   # the secret key (or legacy service_role key)
      - { key: DATA_ENCRYPTION_KEY, sync: false }   # 32 random bytes, base64. Keep a sealed copy.
      - { key: WEB_ORIGIN, sync: false }            # https://training.<your domain>
      - { key: PUBLIC_WEB_URL, sync: false }        # same as WEB_ORIGIN
      - { key: PROXY_SHARED_SECRET, sync: false }   # random hex; the web service needs the SAME value
